name: Validate AgentShield Security Configurations

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate-configs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Locate Configurations & Validate
        run: |
          python -c "
          import os, sys, subprocess

          # 1. Locate docker-compose
          compose_file = None
          for root, dirs, files in os.walk('.'):
              if 'docker-compose.yml' in files or 'docker-compose.yaml' in files:
                  compose_file = os.path.join(root, 'docker-compose.yml' if 'docker-compose.yml' in files else 'docker-compose.yaml')
                  break

          if compose_file:
              print(f'[+] Found Docker Compose at: {compose_file}')
              res = subprocess.run(['docker', 'compose', '-f', compose_file, 'config', '-q'])
              if res.returncode != 0:
                  sys.exit(res.returncode)
          else:
              print('[!] Warning: docker-compose file not found in repository root/subfolders. Skipping docker validation.')

          # 2. Locate Falco local rules
          falco_file = None
          for root, dirs, files in os.walk('.'):
              if 'falco_rules.local.yaml' in files:
                  falco_file = os.path.join(root, 'falco_rules.local.yaml')
                  break

          if falco_file:
              import yaml
              yaml.safe_load(open(falco_file))
              print(f'[+] Falco YAML syntax valid at: {falco_file}')
          else:
              print('[-] Error: falco_rules.local.yaml not found!')
              sys.exit(1)
          "
