name: Validate AgentShield Security Configurations

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate-configs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Locate and Validate Falco Rules
        run: |
          FALCO_FILE=$(find . -name "falco_rules.local.yaml" -print -quit)
          if [ -z "$FALCO_FILE" ]; then
            echo "[-] Error: falco_rules.local.yaml not found!"
            exit 1
          fi
          echo "[+] Found Falco rules at: $FALCO_FILE"
          python3 -c "import yaml; yaml.safe_load(open('$FALCO_FILE'))"
          echo "[+] Falco rule YAML syntax is valid!"

      - name: Locate and Validate Docker Compose
        run: |
          COMPOSE_FILE=$(find . -name "docker-compose.yml" -o -name "docker-compose.yaml" -print -quit)
          if [ -n "$COMPOSE_FILE" ]; then
            echo "[+] Found Docker Compose at: $COMPOSE_FILE"
            docker compose -f "$COMPOSE_FILE" config -q
            echo "[+] Docker Compose syntax is valid!"
          else
            echo "[!] Warning: No docker-compose file found, skipping docker check."
          fi
